[workspace]
resolver = "3"
members = [
    "apps/logisim-desktop",
    "crates/logisim-core",
    "crates/logisim-course",
    "crates/logisim-plugin-api",
    "crates/logisim-plugin",
    "crates/logisim-plugin-sdk",
    "apps/course-plugin",
    "crates/logisim-sim",
    "crates/logisim-file",
    "crates/logisim-ui",
]
default-members = ["apps/logisim-desktop"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
license = "MIT"
publish = false

[workspace.dependencies]
logisim-core = { path = "crates/logisim-core" }
logisim-course = { path = "crates/logisim-course" }
logisim-plugin-api = { path = "crates/logisim-plugin-api" }
logisim-plugin = { path = "crates/logisim-plugin" }
logisim-plugin-sdk = { path = "crates/logisim-plugin-sdk" }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
zerocopy = { version = "=0.8.63", features = ["derive"] }
logisim-sim = { path = "crates/logisim-sim" }
logisim-file = { path = "crates/logisim-file" }
logisim-ui = { path = "crates/logisim-ui" }

egui = { version = "=0.37.0", default-features = false }
eframe = { version = "=0.37.0", default-features = false, features = [
    "default_fonts",
    "system_fonts",
    "wgpu",
    "wayland",
    "x11",
] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
dbg_macro = "warn"
todo = "warn"
