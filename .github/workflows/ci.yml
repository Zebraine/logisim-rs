name: Rust checks

on: [push, pull_request]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Install system font support
        run: sudo apt-get update && sudo apt-get install -y pkg-config libfontconfig1-dev
      - name: Prepare toolchain
        run: |
          rustup show
          rustup component add rustfmt clippy
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Fetch locked dependencies
        run: cargo fetch --locked
      - name: Check workspace
        run: cargo check --workspace --all-targets --locked --offline
      - name: Check lints
        run: cargo clippy --workspace --all-targets --locked --offline -- -D warnings
      - name: Test workspace
        run: cargo test --workspace --locked --offline
