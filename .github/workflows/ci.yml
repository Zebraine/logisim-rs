name: Rust checks

on:
  push:
    branches-ignore: ['release/**']
    tags-ignore: ['**']
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Install system font support
        run: sudo apt-get update && sudo apt-get install -y pkg-config libfontconfig1-dev
      - name: Prepare toolchain
        run: |
          rustup show
          rustup component add rustfmt clippy
          rustup target add wasm32-unknown-unknown
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Fetch locked dependencies
        run: cargo fetch --locked
      - name: Check workspace
        run: cargo check --workspace --all-targets --all-features --locked --offline
      - name: Check lints
        run: cargo clippy --workspace --all-targets --all-features --locked --offline -- -D warnings
      - name: Test workspace
        run: cargo test --workspace --all-features --locked --offline
      - name: Build and verify dynamic plugins
        run: |
          cargo build -p logisim-course-plugin -p logisim-ttl-plugin -p logisim-ttl-combinational-plugin -p logisim-ttl-sequential-plugin -p logisim-input-plugin -p logisim-display-plugin --release --target wasm32-unknown-unknown --locked --offline
          cargo run -p logisim-plugin --bin logisim-plugin-check --locked --offline -- target/wasm32-unknown-unknown/release/logisim_course_plugin.wasm
          cargo run -p logisim-course-plugin --features host-check --bin course-plugin-check --locked --offline -- target/wasm32-unknown-unknown/release/logisim_course_plugin.wasm
          cargo run -p logisim-plugin --bin logisim-plugin-check --locked --offline -- target/wasm32-unknown-unknown/release/logisim_ttl_plugin.wasm
          cargo run -p logisim-ttl-plugin --features host-check --bin ttl-plugin-check --locked --offline -- target/wasm32-unknown-unknown/release/logisim_ttl_plugin.wasm
          cargo run -p logisim-plugin --bin logisim-plugin-check --locked --offline -- target/wasm32-unknown-unknown/release/logisim_ttl_combinational_plugin.wasm
          cargo run -p logisim-ttl-combinational-plugin --features host-check --bin ttl-combinational-plugin-check --locked --offline -- target/wasm32-unknown-unknown/release/logisim_ttl_combinational_plugin.wasm
          cargo run -p logisim-plugin --bin logisim-plugin-check --locked --offline -- target/wasm32-unknown-unknown/release/logisim_ttl_sequential_plugin.wasm
          cargo run -p logisim-ttl-sequential-plugin --features host-check --bin ttl-sequential-plugin-check --locked --offline -- target/wasm32-unknown-unknown/release/logisim_ttl_sequential_plugin.wasm
          cargo run -p logisim-plugin --bin logisim-plugin-check --locked --offline -- target/wasm32-unknown-unknown/release/logisim_input_plugin.wasm
          cargo run -p logisim-input-plugin --features host-check --bin input-plugin-check --locked --offline -- target/wasm32-unknown-unknown/release/logisim_input_plugin.wasm
          cargo run -p logisim-plugin --bin logisim-plugin-check --locked --offline -- target/wasm32-unknown-unknown/release/logisim_display_plugin.wasm
          cargo run -p logisim-display-plugin --features host-check --bin display-plugin-check --locked --offline -- target/wasm32-unknown-unknown/release/logisim_display_plugin.wasm
      - name: Verify editable Snake example with built plugins
        run: |
          # Regenerate after authoring changes: cargo run -p logisim-examples --release --locked -- generate plugins/input/input.wasm plugins/display/display.wasm examples/games/snake.circ
          mkdir -p target/snake-example-check/examples/games target/snake-example-check/plugins/input target/snake-example-check/plugins/display
          cp examples/games/snake.circ target/snake-example-check/examples/games/snake.circ
          cp target/wasm32-unknown-unknown/release/logisim_input_plugin.wasm target/snake-example-check/plugins/input/input.wasm
          cp target/wasm32-unknown-unknown/release/logisim_display_plugin.wasm target/snake-example-check/plugins/display/display.wasm
          cargo run -p logisim-examples --release --locked --offline -- check target/snake-example-check/examples/games/snake.circ
