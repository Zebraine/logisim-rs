[package]
name = "logisim-display-plugin"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
logisim-plugin-api.workspace = true
logisim-plugin-sdk.workspace = true
serde_json.workspace = true
logisim-plugin = { workspace = true, optional = true }
logisim-sim = { workspace = true, optional = true }
logisim-core = { workspace = true, optional = true }
logisim-file = { workspace = true, optional = true }

[features]
host-check = ["dep:logisim-plugin", "dep:logisim-sim", "dep:logisim-core", "dep:logisim-file"]

[[bin]]
name = "display-plugin-check"
path = "src/bin/check.rs"
required-features = ["host-check"]

[lints.rust]
unsafe_code = "deny"
[lints.clippy]
dbg_macro = "warn"
todo = "warn"
