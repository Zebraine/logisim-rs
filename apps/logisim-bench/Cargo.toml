[package]
name = "logisim-bench"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[features]
dataflow-study = ["logisim-sim/dataflow-study"]
wasmtime-cache = ["engine-study", "wasmtime-abi4", "logisim-plugin/wasmtime-cache"]
wasmtime-abi4 = ["logisim-plugin/wasmtime-abi4"]
compare-wasmtime = ["engine-study", "logisim-plugin/compare-wasmtime"]
engine-study = ["plugin-metrics", "logisim-plugin/engine-study"]
default = ["plugin-metrics"]
plugin-metrics = ["logisim-plugin/plugin-metrics", "logisim-sim/plugin-metrics"]

[dependencies]
logisim-core.workspace = true
logisim-file.workspace = true
logisim-plugin.workspace = true
logisim-sim.workspace = true
serde.workspace = true
serde_json.workspace = true

[lints]
workspace = true
