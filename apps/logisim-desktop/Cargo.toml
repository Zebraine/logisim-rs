[package]
name = "logisim-rs"
description = "Desktop entry point for the logisim-rs cleanroom rewrite"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[features]
default = ["wasmtime-abi4", "wasmtime-cache"]
wasmtime-cache = ["wasmtime-abi4", "logisim-plugin/wasmtime-cache"]
wasmtime-abi4 = ["logisim-plugin/wasmtime-abi4"]

[dependencies]
logisim-preferences.workspace = true
serde.workspace = true
serde_json.workspace = true
eframe.workspace = true
image = { version = "=0.25.10", default-features = false, features = ["png"] }
logisim-core.workspace = true
logisim-sim.workspace = true
logisim-plugin.workspace = true
logisim-file.workspace = true
logisim-ui.workspace = true

[dev-dependencies]
logisim-agent = { path = "../../crates/logisim-agent" }
wat = "=1.245.1"

[lints]
workspace = true
