[package]
name = "logisim-course-plugin"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
[lib]
crate-type = ["cdylib", "rlib"]
[dependencies]
logisim-core.workspace = true
logisim-course.workspace = true
logisim-plugin-api.workspace = true
logisim-plugin-sdk.workspace = true
serde_json.workspace = true
logisim-plugin = { workspace = true, optional = true }
logisim-sim = { workspace = true, optional = true }
logisim-file = { workspace = true, optional = true }
roxmltree = { version = "=0.20.0", optional = true }
[features]
host-check = ["dep:logisim-plugin", "dep:logisim-sim", "dep:logisim-file", "dep:roxmltree"]
[[bin]]
name = "course-plugin-convert"
path = "src/bin/convert.rs"
required-features = ["host-check"]
[[bin]]
name = "course-plugin-check"
path = "src/bin/check.rs"
required-features = ["host-check"]
# The SDK export macro locally permits only unsafe symbol attributes for the Wasm ABI.
# No unsafe blocks are used; all other workspace crates continue to forbid unsafe code.
[lints.rust]
unsafe_code = "deny"
[lints.clippy]
dbg_macro = "warn"
todo = "warn"
