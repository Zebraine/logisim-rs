[package]
name = "logisim-plugin"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
[features]
compare-wasmtime = ["dep:wasmtime"]
engine-study = ["plugin-metrics"]
plugin-metrics = ["logisim-plugin-api/plugin-metrics"]

[dependencies]
logisim-plugin-api.workspace = true
serde.workspace = true
serde_json.workspace = true
wasmi = { version = "=1.1.0", default-features = false, features = ["std"] }
wasmtime = { version = "=36.0.20", default-features = false, features = ["std", "runtime", "cranelift", "cache"], optional = true }
[dev-dependencies]
wat = "=1.245.1"
[lints]
workspace = true
