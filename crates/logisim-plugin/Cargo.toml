[package]
name = "logisim-plugin"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
[features]
wasmtime-abi4 = ["dep:wasmtime"]
wasmtime-cache = ["wasmtime-abi4", "wasmtime/cache", "dep:sha2", "dep:libc"]
compare-wasmtime = ["wasmtime-abi4", "wasmtime/cache"]
engine-study = ["plugin-metrics"]
plugin-metrics = ["logisim-plugin-api/plugin-metrics"]

[dependencies]
logisim-plugin-api.workspace = true
serde.workspace = true
serde_json.workspace = true
wasmparser = { version = "=0.239.0", default-features = false }
wasmi = { version = "=1.1.0", default-features = false, features = ["std"] }
wasmtime = { version = "=36.0.20", default-features = false, features = ["std", "runtime", "cranelift"], optional = true }
sha2 = { version = "=0.10.9", optional = true }

[target.'cfg(target_os = "linux")'.dependencies]
libc = { version = "=0.2.191", optional = true }

[dev-dependencies]
sha2 = "=0.10.9"
wat = "=1.245.1"
[lints]
workspace = true
