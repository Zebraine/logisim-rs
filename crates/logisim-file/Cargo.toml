[package]
name = "logisim-file"
description = "Native .lrs projects, legacy .circ conversion and diagnostics"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[features]
codec-study = ["dep:serde_cbor", "dep:postcard"]

[dependencies]
logisim-core.workspace = true
serde.workspace = true
getrandom = "=0.4.3"
serde_json.workspace = true
roxmltree = "=0.20.0"
serde_cbor = { version = "=0.11.2", optional = true }
postcard = { version = "=1.1.3", default-features = false, features = ["alloc"], optional = true }

[lints]
workspace = true

[[bin]]
name = "lrs-codec-study"
path = "src/bin/lrs-codec-study.rs"
required-features = ["codec-study"]
