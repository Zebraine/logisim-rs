[package]
name = "logisim-agent"
description = "Headless project, simulation and preference service"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[features]
# Retain the old build flag for callers. Agent execution always uses wasmi.
wasmtime-experimental = []

[dependencies]
logisim-preferences.workspace = true
logisim-core.workspace = true
logisim-file.workspace = true
logisim-sim.workspace = true
logisim-plugin.workspace = true
serde.workspace = true
serde_json = { workspace = true, features = ["raw_value"] }
getrandom = "=0.4.3"

[lints]
workspace = true

[[test]]
name = "stdio"
path = "src/tests/stdio.rs"
