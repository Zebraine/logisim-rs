[package]
name = "logisim-ui"
description = "egui workspace layout and navigable circuit canvas"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
serde.workspace = true
egui.workspace = true
fontique = { version = "=0.11.1", default-features = false, features = ["system", "fontconfig-dlopen"] }
read-fonts = "=0.41.0"
logisim-core.workspace = true

[build-dependencies]
serde.workspace = true
serde_json.workspace = true

[dev-dependencies]
# Match desktop text metrics when this crate's input tests run on their own.
egui = { workspace = true, features = ["default_fonts"] }
serde_json.workspace = true

[lints]
workspace = true
